<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دكانة — تسوق أونلاين في مصر | ملابس وإكسسوارات وإلكترونيات</title>
<meta name="description" content="دكانة: متجر مصري أونلاين — ملابس رجالي وحريمي، إكسسوارات، وإلكترونيات. الدفع كاش عند الاستلام أو فودافون كاش، وتوصيل لكل المحافظات.">
<meta name="theme-color" content="#101528">
<meta property="og:type" content="website">
<meta property="og:title" content="دكانة — تسوق أونلاين في مصر">
<meta property="og:description" content="ملابس وإكسسوارات وإلكترونيات — كاش عند الاستلام أو فودافون كاش، توصيل لكل المحافظات.">
<meta property="og:url" content="https://abdonateai92-star.github.io/dokkana/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101528'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='%23f5c518' font-family='sans-serif' font-weight='bold'%3E%D8%AF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{ --navy:#101528; --gold:#f5c518; --bg:#f4f5f9; --green:#0a7d32; --red:#e74c3c; --rad:16px;
  --shadow:0 2px 10px rgba(16,21,40,.08); }
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; -webkit-tap-highlight-color:transparent; }
body{ background:var(--bg); color:#1a1a2e; padding-bottom:76px; }
button{ font-family:inherit; }

/* شريط إعلان */
#announce{ background:var(--gold); color:var(--navy); text-align:center; font-weight:700; font-size:13px;
  padding:7px 12px; display:none; }

/* الهيدر */
header{ background:var(--navy); color:#fff; padding:12px 14px; position:sticky; top:0; z-index:60;
  display:flex; gap:10px; align-items:center; box-shadow:var(--shadow); }
.logo{ font-size:25px; font-weight:800; white-space:nowrap; }
.logo span{ color:var(--gold); }
#search{ flex:1; border:none; border-radius:12px; padding:9px 14px; font-size:14px; background:#222a45; color:#fff; outline:none; min-width:0; }
#search::placeholder{ color:#8a91ad; }
#cartBtn{ background:var(--gold); color:var(--navy); border:none; border-radius:12px; padding:9px 14px;
  font-weight:800; font-size:14px; cursor:pointer; position:relative; white-space:nowrap; }
#cartCount{ position:absolute; top:-7px; inset-inline-start:-7px; background:var(--red); color:#fff; border-radius:50%;
  min-width:20px; height:20px; font-size:11px; display:flex; align-items:center; justify-content:center; padding:0 4px; }

/* الهيرو */
#hero{ background:linear-gradient(135deg,#101528 0%,#1e2a52 60%,#2c3a6e 100%); color:#fff;
  padding:26px 20px 30px; text-align:center; }
#hero h1{ font-size:22px; font-weight:800; margin-bottom:6px; }
#hero p{ color:#c3c9e2; font-size:14px; }

/* أدوات الفلترة */
#controls{ position:sticky; top:57px; z-index:50; background:var(--bg); padding:10px 12px 6px; }
#cats{ display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
#cats::-webkit-scrollbar{ display:none; }
.chip{ white-space:nowrap; border:1.5px solid #d8dbe6; background:#fff; border-radius:20px; padding:6px 15px;
  font-size:13px; font-weight:700; cursor:pointer; color:#3a3f55; }
.chip.on{ background:var(--navy); color:#fff; border-color:var(--navy); }
#sortRow{ display:flex; justify-content:space-between; align-items:center; padding:4px 2px 2px; }
#count{ font-size:12px; color:#8a8fa5; font-weight:600; }
#sort{ border:1.5px solid #d8dbe6; background:#fff; border-radius:10px; padding:5px 10px; font-size:13px; font-weight:700; color:#3a3f55; }

/* الشبكة */
#grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:10px 12px; max-width:1100px; margin:auto; }
@media(min-width:640px){ #grid{ grid-template-columns:repeat(3,1fr); } }
@media(min-width:900px){ #grid{ grid-template-columns:repeat(4,1fr); } }
.card{ background:#fff; border-radius:var(--rad); overflow:hidden; cursor:pointer; box-shadow:var(--shadow);
  display:flex; flex-direction:column; position:relative; transition:transform .12s; }
.card:active{ transform:scale(.98); }
.card .imgw{ position:relative; aspect-ratio:1; background:#eceef4; }
.card img{ width:100%; height:100%; object-fit:cover; display:block; }
.badge-off{ position:absolute; top:8px; inset-inline-start:8px; background:var(--red); color:#fff;
  border-radius:8px; padding:2px 8px; font-size:11px; font-weight:800; }
.badge-out{ position:absolute; inset:0; background:rgba(255,255,255,.65); display:flex; align-items:center;
  justify-content:center; font-weight:800; color:var(--red); font-size:15px; }
.card .info{ padding:10px 12px; flex:1; display:flex; flex-direction:column; gap:4px; }
.card .name{ font-size:13.5px; font-weight:600; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.price{ font-weight:800; color:var(--green); font-size:15px; }
.old{ text-decoration:line-through; color:#a0a4b5; font-size:12px; font-weight:400; margin-inline-start:6px; }
.low{ font-size:11px; color:#b3541e; font-weight:700; }
.addbtn{ margin-top:6px; background:var(--navy); color:#fff; border:none; border-radius:10px;
  padding:9px; font-weight:700; cursor:pointer; font-size:13px; }
.addbtn:disabled{ background:#c9cddb; cursor:default; }

/* سكيلتون التحميل */
.sk{ background:#fff; border-radius:var(--rad); overflow:hidden; box-shadow:var(--shadow); }
.sk .a{ aspect-ratio:1; } .sk .b{ height:14px; margin:12px; border-radius:7px; } .sk .c{ height:12px; margin:0 12px 14px; width:50%; border-radius:6px; }
.shimmer{ background:linear-gradient(90deg,#eceef4 25%,#f7f8fb 50%,#eceef4 75%); background-size:200% 100%; animation:sh 1.2s infinite; }
@keyframes sh{ to{ background-position:-200% 0; } }
.empty{ text-align:center; padding:60px 20px; color:#8a8fa5; font-size:15px; grid-column:1/-1; }
.empty .e{ font-size:44px; display:block; margin-bottom:10px; }

/* النوافذ المنبثقة */
.overlay{ position:fixed; inset:0; background:rgba(16,21,40,.55); z-index:100; display:none;
  align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
.overlay.show{ display:flex; }
.sheet{ background:#fff; width:100%; max-width:540px; border-radius:22px 22px 0 0;
  max-height:90vh; overflow-y:auto; padding:18px; animation:up .18s ease-out; }
@keyframes up{ from{ transform:translateY(30px); opacity:.5; } }
.closeX{ float:left; background:#eef0f5; border:none; width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer; }

/* نافذة المنتج */
.gallery{ position:relative; border-radius:var(--rad); overflow:hidden; background:#eceef4; }
.gallery .track{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.gallery .track::-webkit-scrollbar{ display:none; }
.gallery img{ width:100%; flex:0 0 100%; aspect-ratio:1; object-fit:cover; scroll-snap-align:center; }
.dots{ position:absolute; bottom:10px; left:0; right:0; display:flex; gap:6px; justify-content:center; }
.dots i{ width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.6); }
.dots i.on{ background:#fff; width:18px; border-radius:4px; }
.sheet h2{ font-size:19px; margin:12px 0 4px; }
.sheet .desc{ color:#5a5f75; font-size:14px; margin:8px 0; line-height:1.8; white-space:pre-line; }
.optrow{ margin:12px 0; }
.optrow>label{ font-weight:700; font-size:14px; display:block; margin-bottom:6px; }
.opts{ display:flex; gap:8px; flex-wrap:wrap; }
.opt{ border:1.5px solid #d8dbe6; border-radius:10px; padding:7px 16px; font-weight:700; font-size:13px; cursor:pointer; background:#fff; }
.opt.sel{ border-color:var(--navy); background:var(--navy); color:#fff; }
.qty{ display:flex; align-items:center; gap:14px; }
.qty button{ width:40px; height:40px; border-radius:12px; border:1.5px solid #d8dbe6; background:#fff; font-size:19px; font-weight:700; cursor:pointer; }
.bigbtn{ width:100%; background:var(--gold); color:var(--navy); border:none; border-radius:14px;
  padding:15px; font-size:16px; font-weight:800; cursor:pointer; margin-top:14px; }
.bigbtn:disabled{ opacity:.6; }
.ghostbtn{ width:100%; background:#eef0f5; color:var(--navy); border:none; border-radius:14px;
  padding:13px; font-size:14px; font-weight:700; cursor:pointer; margin-top:8px; }

/* السلة */
.cartrow{ display:flex; gap:10px; padding:12px 0; border-bottom:1px solid #eef0f5; align-items:flex-start; }
.cartrow img{ width:60px; height:60px; border-radius:12px; object-fit:cover; background:#eceef4; }
.cartrow .cinfo{ flex:1; font-size:13.5px; }
.cartrow .rm{ background:none; border:none; color:var(--red); cursor:pointer; font-size:12px; font-weight:700; }
.totals{ margin-top:14px; font-size:14.5px; }
.totals>div{ display:flex; justify-content:space-between; padding:5px 0; }
.totals .grand{ font-weight:800; font-size:17px; border-top:2px solid var(--navy); padding-top:9px; margin-top:7px; }
.totals .disc{ color:var(--green); font-weight:700; }

/* إتمام الطلب */
.field{ margin-bottom:12px; }
.field label{ font-weight:700; font-size:13.5px; display:block; margin-bottom:5px; }
.field input,.field select,.field textarea{ width:100%; padding:12px; border:1.5px solid #d8dbe6;
  border-radius:12px; font-size:15px; background:#fff; outline:none; }
.field input:focus,.field select:focus,.field textarea:focus{ border-color:var(--navy); }
.payopt{ display:flex; gap:8px; }
.payopt label{ flex:1; border:1.5px solid #d8dbe6; border-radius:14px; padding:13px 8px; text-align:center;
  font-weight:700; font-size:13.5px; cursor:pointer; }
.payopt input{ display:none; }
.payopt label.sel{ border-color:var(--navy); background:#eef2ff; }
.vfbox{ background:#fff5f5; border:1.5px solid #f5c6c6; border-radius:14px; padding:12px;
  font-size:14px; margin-top:10px; display:none; line-height:2; }
.promorow{ display:flex; gap:8px; }
.promorow input{ flex:1; }
.promorow button{ border:none; background:var(--navy); color:#fff; border-radius:12px; padding:0 18px; font-weight:700; cursor:pointer; }
#promoMsg{ font-size:12.5px; margin-top:5px; font-weight:700; }

/* نجاح الطلب */
.success{ text-align:center; padding:26px 8px; }
.success .check{ font-size:56px; }
.ordercode{ background:var(--navy); color:var(--gold); font-size:24px; font-weight:800; letter-spacing:2px;
  border-radius:14px; padding:12px; margin:14px 0; }
.wbtn{ display:block; background:#25d366; color:#fff; border-radius:14px; padding:14px;
  text-decoration:none; font-weight:800; margin-top:12px; font-size:15px; }

/* تتبع الطلب */
.statusline{ display:flex; justify-content:space-between; margin:20px 4px 6px; position:relative; }
.statusline::before{ content:""; position:absolute; top:13px; right:20px; left:20px; height:3px; background:#e4e6ee; }
.st{ position:relative; text-align:center; flex:1; font-size:11px; font-weight:700; color:#a0a4b5; }
.st i{ display:flex; width:28px; height:28px; border-radius:50%; background:#e4e6ee; margin:0 auto 6px;
  align-items:center; justify-content:center; font-style:normal; color:#fff; font-size:13px; }
.st.done{ color:var(--navy); } .st.done i{ background:var(--green); }
.st.now i{ background:var(--gold); color:var(--navy); box-shadow:0 0 0 4px rgba(245,197,24,.3); }

/* شريط التنقل السفلي */
nav{ position:fixed; bottom:0; right:0; left:0; background:#fff; border-top:1px solid #e4e6ee; z-index:90;
  display:flex; box-shadow:0 -2px 12px rgba(16,21,40,.06); }
nav a{ flex:1; text-align:center; padding:9px 0 7px; text-decoration:none; color:#8a8fa5; font-size:11px; font-weight:700; }
nav a b{ display:block; font-size:20px; margin-bottom:1px; }
nav a.on{ color:var(--navy); }

/* توست */
#toast{ position:fixed; bottom:84px; right:50%; transform:translateX(50%); background:var(--navy); color:#fff;
  border-radius:12px; padding:11px 20px; font-size:14px; font-weight:700; z-index:200; display:none; box-shadow:var(--shadow); }
</style>
</head>
<body>

<div id="announce"></div>
<header>
  <div class="logo">دكانة<span>.</span></div>
  <input id="search" placeholder="دوّر على منتج…">
  <button id="cartBtn">🛒 <span id="cartCount">0</span></button>
</header>

<div id="pageStore">
  <div id="hero"><h1>كل اللي محتاجه، في مكان واحد 🛍️</h1><p>كاش عند الاستلام أو فودافون كاش — توصيل لكل محافظات مصر</p></div>
  <div id="controls">
    <div id="cats"></div>
    <div id="sortRow">
      <span id="count"></span>
      <select id="sort" onchange="state.sort=this.value;renderGrid()">
        <option value="new">الأحدث</option>
        <option value="priceAsc">السعر: من الأقل</option>
        <option value="priceDesc">السعر: من الأعلى</option>
      </select>
    </div>
  </div>
  <div id="grid"></div>
</div>

<!-- نافذة المنتج -->
<div class="overlay" id="pOverlay">
  <div class="sheet">
    <button class="closeX" onclick="closeProduct()">✕</button>
    <div class="gallery">
      <div class="track" id="pTrack"></div>
      <div class="dots" id="pDots"></div>
    </div>
    <h2 id="pName"></h2>
    <div><span class="price" id="pPrice"></span><span class="old" id="pOld"></span> <span class="low" id="pLow"></span></div>
    <div class="desc" id="pDesc"></div>
    <div class="optrow" id="sizeRow" style="display:none"><label>المقاس</label><div class="opts" id="pSizes"></div></div>
    <div class="optrow" id="colorRow" style="display:none"><label>اللون</label><div class="opts" id="pColors"></div></div>
    <div class="optrow"><label>الكمية</label>
      <div class="qty"><button onclick="chQty(1)">+</button><b id="pQty">1</b><button onclick="chQty(-1)">−</button></div>
    </div>
    <button class="bigbtn" id="pAdd" onclick="addToCart()">أضف للسلة 🛒</button>
    <button class="ghostbtn" onclick="shareProduct()">📤 شارك المنتج</button>
  </div>
</div>

<!-- السلة -->
<div class="overlay" id="cOverlay">
  <div class="sheet">
    <button class="closeX" onclick="closeOverlay('cOverlay')">✕</button>
    <h2>🛒 سلة التسوق</h2>
    <div id="cartItems"></div>
    <div class="totals" id="cartTotals"></div>
    <button class="bigbtn" id="checkoutBtn" onclick="openCheckout()">إتمام الطلب ✅</button>
  </div>
</div>

<!-- إتمام الطلب -->
<div class="overlay" id="oOverlay">
  <div class="sheet" id="checkoutSheet">
    <button class="closeX" onclick="closeOverlay('oOverlay')">✕</button>
    <h2>📦 بيانات التوصيل</h2>
    <div style="height:12px"></div>
    <div class="field"><label>الاسم بالكامل</label><input id="fName" placeholder="مثال: محمد أحمد"></div>
    <div class="field"><label>رقم الموبايل</label><input id="fPhone" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx"></div>
    <div class="field"><label>المحافظة</label><select id="fGov" onchange="renderOrderTotals()"></select></div>
    <div class="field"><label>العنوان بالتفصيل</label><textarea id="fAddr" rows="2" placeholder="الشارع، رقم العمارة، الدور، علامة مميزة"></textarea></div>
    <div class="field"><label>كود الخصم (لو عندك)</label>
      <div class="promorow"><input id="fPromo" placeholder="مثال: SALE10" style="text-transform:uppercase"><button onclick="applyPromo()">تطبيق</button></div>
      <div id="promoMsg"></div>
    </div>
    <div class="field"><label>طريقة الدفع</label>
      <div class="payopt">
        <label id="payCod" class="sel"><input type="radio" name="pay" value="cod" checked>💵 كاش عند الاستلام</label>
        <label id="payVf"><input type="radio" name="pay" value="vodafone">📱 فودافون كاش</label>
      </div>
      <div class="vfbox" id="vfBox"></div>
    </div>
    <div class="field"><label>ملاحظات (اختياري)</label><input id="fNotes" placeholder="أي تفاصيل إضافية"></div>
    <div class="totals" id="orderTotals"></div>
    <button class="bigbtn" id="placeBtn" onclick="placeOrder()">تأكيد الطلب 🚀</button>
  </div>
</div>

<!-- تتبع الطلب -->
<div class="overlay" id="tOverlay">
  <div class="sheet">
    <button class="closeX" onclick="closeOverlay('tOverlay')">✕</button>
    <h2>🚚 تتبع طلبك</h2>
    <div style="height:12px"></div>
    <div id="trackForm">
      <div class="field"><label>كود الطلب</label><input id="tCode" placeholder="DK-XXXXXX" style="text-transform:uppercase"></div>
      <div class="field"><label>رقم الموبايل اللي اتطلب بيه</label><input id="tPhone" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx"></div>
      <button class="bigbtn" onclick="trackOrder()">عرض حالة الطلب</button>
    </div>
    <div id="trackResult"></div>
  </div>
</div>

<nav>
  <a href="#" class="on" onclick="navGo('store');return false"><b>🏠</b>المتجر</a>
  <a href="#" onclick="navGo('track');return false"><b>🚚</b>تتبع طلبك</a>
  <a href="#" onclick="navGo('cart');return false"><b>🛒</b>السلة</a>
</nav>

<div id="toast"></div>

<!-- FIREBASE-SCRIPTS-START -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<!-- FIREBASE-SCRIPTS-END -->
<script src="store-core.js"></script>
<script>
"use strict";
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const C = DokkanaCore;
const $ = id => document.getElementById(id);

/* ---------- الحالة ---------- */
const CACHE_KEY = "dokkana_cache_v2", CART_KEY = "dokkana_cart", CACHE_TTL = 5*60*1000;
let settings = { vodafoneNumber:"", whatsappNumber:"", announcement:"", fees:{default:0, govs:{}} };
let cats = [], products = [], cart = [];
let state = { cat:"all", sort:"new", q:"" };
let cur = null, curQty = 1, selSize = "", selColor = "";
let appliedCode = "", appliedPromo = null;

try { cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch(e) { cart = []; }

const firstImg = p => (p.images && p.images[0]) || "";
const outOfStock = p => p.stock !== null && p.stock !== undefined && p.stock !== "" && Number(p.stock) <= 0;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._x); t._x=setTimeout(()=>t.style.display="none",2200); }

/* ---------- التحميل (مع كاش 5 دقائق لتوفير القراءات وتسريع الفتح) ---------- */
async function loadAll(force) {
  let cached = null;
  try { cached = JSON.parse(sessionStorage.getItem(CACHE_KEY)); } catch(e) {}
  if (!force && cached && Date.now()-cached.ts < CACHE_TTL) {
    settings = Object.assign(settings, cached.settings); cats = cached.cats; products = cached.products;
  } else {
    const [sSnap, cSnap, pSnap] = await Promise.all([
      db.collection("settings").doc("store").get().catch(()=>({exists:false})),
      db.collection("categories").where("active","==",true).get(),
      db.collection("products").where("active","==",true).get()
    ]);
    if (sSnap.exists) settings = Object.assign(settings, sSnap.data());
    cats = cSnap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    products = pSnap.docs.map(d => ({id:d.id, ...d.data()}));
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(), settings, cats, products})); } catch(e){}
  }
  if (settings.announcement) { $("announce").textContent = settings.announcement; $("announce").style.display="block"; }
  renderCats(); renderGrid(); renderCartCount();
  if (location.hash.startsWith("#p/")) openProduct(location.hash.slice(3));
}

/* ---------- عرض المتجر ---------- */
function skeleton(){ $("grid").innerHTML = Array(6).fill('<div class="sk"><div class="a shimmer"></div><div class="b shimmer"></div><div class="c shimmer"></div></div>').join(""); }

function renderCats(){
  $("cats").innerHTML = `<button class="chip ${state.cat==='all'?'on':''}" onclick="pickCat('all')">الكل</button>` +
    cats.map(c => `<button class="chip ${state.cat===c.id?'on':''}" onclick="pickCat('${c.id}')">${c.name}</button>`).join("");
}
function pickCat(id){ state.cat=id; renderCats(); renderGrid(); }

function visibleProducts(){
  let list = state.cat==="all" ? products.slice() : products.filter(p=>p.categoryId===state.cat);
  const q = state.q.trim();
  if (q) list = list.filter(p => (p.name||"").includes(q) || (p.description||"").includes(q));
  if (state.sort==="priceAsc") list.sort((a,b)=>a.price-b.price);
  else if (state.sort==="priceDesc") list.sort((a,b)=>b.price-a.price);
  else list.sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
  return list;
}

function renderGrid(){
  const list = visibleProducts();
  $("count").textContent = list.length ? list.length+" منتج" : "";
  if (!list.length){ $("grid").innerHTML = `<div class="empty"><span class="e">🔍</span>مفيش منتجات مطابقة — جرّب بحث تاني أو قسم مختلف</div>`; return; }
  $("grid").innerHTML = list.map(p => {
    const off = p.oldPrice && p.oldPrice > p.price ? Math.round((1-p.price/p.oldPrice)*100) : 0;
    const out = outOfStock(p);
    const low = !out && p.stock !== null && p.stock !== undefined && p.stock !== "" && Number(p.stock) <= 3 ? `باقي ${p.stock} بس!` : "";
    return `<div class="card" onclick="openProduct('${p.id}')">
      <div class="imgw"><img loading="lazy" src="${firstImg(p)}" alt="" onerror="this.style.visibility='hidden'">
        ${off?`<span class="badge-off">خصم ${off}%</span>`:""}${out?`<div class="badge-out">نفدت الكمية</div>`:""}</div>
      <div class="info">
        <div class="name">${p.name}</div>
        <div><span class="price">${C.eg(p.price)}</span>${p.oldPrice&&p.oldPrice>p.price?`<span class="old">${C.eg(p.oldPrice)}</span>`:""}</div>
        ${low?`<span class="low">${low}</span>`:""}
        <button class="addbtn" ${out?"disabled":""} onclick="event.stopPropagation();openProduct('${p.id}')">${out?"غير متوفر":"أضف للسلة 🛒"}</button>
      </div></div>`;
  }).join("");
}

$("search").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });

/* ---------- نافذة المنتج ---------- */
function openProduct(id){
  cur = products.find(p=>p.id===id); if(!cur) return;
  history.replaceState(null,"","#p/"+id);
  curQty = 1; $("pQty").textContent = 1;
  selSize = (cur.sizes&&cur.sizes[0])||""; selColor = (cur.colors&&cur.colors[0])||"";
  const imgs = (cur.images&&cur.images.length?cur.images:[""]);
  $("pTrack").innerHTML = imgs.map(s=>`<img src="${s}" onerror="this.style.visibility='hidden'">`).join("");
  $("pDots").innerHTML = imgs.length>1 ? imgs.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join("") : "";
  $("pTrack").onscroll = e => {
    const i = Math.round(e.target.scrollLeft / e.target.clientWidth);
    document.querySelectorAll("#pDots i").forEach((d,j)=>d.classList.toggle("on", j===i));
  };
  $("pTrack").scrollLeft = 0;
  $("pName").textContent = cur.name;
  $("pPrice").textContent = C.eg(cur.price);
  $("pOld").textContent = cur.oldPrice && cur.oldPrice>cur.price ? C.eg(cur.oldPrice) : "";
  $("pDesc").textContent = cur.description || "";
  const out = outOfStock(cur);
  $("pLow").textContent = out ? "" : (cur.stock!==null&&cur.stock!==undefined&&cur.stock!==""&&Number(cur.stock)<=3 ? `باقي ${cur.stock} بس!` : "");
  if (cur.sizes&&cur.sizes.length){ $("sizeRow").style.display="block"; $("pSizes").innerHTML = cur.sizes.map(s=>`<button class="opt ${s===selSize?'sel':''}" onclick="pickOpt(this,'size','${s}')">${s}</button>`).join(""); }
  else $("sizeRow").style.display="none";
  if (cur.colors&&cur.colors.length){ $("colorRow").style.display="block"; $("pColors").innerHTML = cur.colors.map(s=>`<button class="opt ${s===selColor?'sel':''}" onclick="pickOpt(this,'color','${s}')">${s}</button>`).join(""); }
  else $("colorRow").style.display="none";
  $("pAdd").disabled = out;
  $("pAdd").textContent = out ? "نفدت الكمية ❌" : "أضف للسلة 🛒";
  $("pOverlay").classList.add("show");
}
function pickOpt(el, kind, val){
  if (kind==="size"){ selSize=val; document.querySelectorAll("#pSizes .opt").forEach(b=>b.classList.toggle("sel", b===el)); }
  else { selColor=val; document.querySelectorAll("#pColors .opt").forEach(b=>b.classList.toggle("sel", b===el)); }
}
function closeProduct(){ closeOverlay("pOverlay"); history.replaceState(null,"","#"); }
function chQty(d){
  const max = cur && cur.stock!==null&&cur.stock!==undefined&&cur.stock!=="" ? Number(cur.stock) : 99;
  curQty = Math.max(1, Math.min(max, curQty+d)); $("pQty").textContent = curQty;
}
function shareProduct(){
  const url = location.origin + location.pathname + "#p/" + cur.id;
  const text = `${cur.name} — ${C.eg(cur.price)} من دكانة 👌\n${url}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
function addToCart(){
  const key = cur.id+"|"+selSize+"|"+selColor;
  const found = cart.find(i=>i.key===key);
  if (found) found.qty += curQty;
  else cart.push({key, id:cur.id, name:cur.name, price:cur.price, image:firstImg(cur), size:selSize, color:selColor, qty:curQty});
  saveCart(); closeProduct(); toast("اتضاف للسلة ✅"); openCart();
}

/* ---------- السلة ---------- */
function saveCart(){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); renderCartCount(); }
function renderCartCount(){ $("cartCount").textContent = cart.reduce((a,i)=>a+i.qty,0); }
function openCart(){ renderCart(); $("cOverlay").classList.add("show"); }
function renderCart(){
  if (!cart.length){ $("cartItems").innerHTML = `<div class="empty"><span class="e">🛒</span>السلة فاضية — ابدأ التسوق!</div>`; $("cartTotals").innerHTML=""; $("checkoutBtn").style.display="none"; return; }
  $("checkoutBtn").style.display="block";
  $("cartItems").innerHTML = cart.map((i,ix)=>`
    <div class="cartrow">
      <img src="${i.image}" onerror="this.style.visibility='hidden'">
      <div class="cinfo"><b>${i.name}</b><br>
        <span style="color:#8a8fa5">${i.size?("مقاس: "+i.size+" "):""}${i.color?("لون: "+i.color):""}</span><br>
        ${C.eg(i.price)} × ${i.qty}
        <div class="qty" style="margin-top:6px">
          <button onclick="cartQty(${ix},1)">+</button><b>${i.qty}</b><button onclick="cartQty(${ix},-1)">−</button>
        </div></div>
      <button class="rm" onclick="cartRm(${ix})">حذف ✕</button>
    </div>`).join("");
  $("cartTotals").innerHTML = `<div><span>إجمالي المنتجات</span><span>${C.eg(C.cartSubtotal(cart))}</span></div>
    <div style="color:#8a8fa5;font-size:12.5px">الشحن والخصم بيتحسبوا في الخطوة الجاية</div>`;
}
function cartQty(ix,d){ cart[ix].qty = Math.max(1, cart[ix].qty+d); saveCart(); renderCart(); }
function cartRm(ix){ cart.splice(ix,1); saveCart(); renderCart(); }

/* ---------- إتمام الطلب ---------- */
function openCheckout(){
  if (!cart.length) return;
  closeOverlay("cOverlay");
  $("fGov").innerHTML = C.GOVS.map(g=>`<option>${g}</option>`).join("");
  appliedCode=""; appliedPromo=null; $("fPromo").value=""; $("promoMsg").textContent="";
  renderOrderTotals(); updateVfBox();
  $("oOverlay").classList.add("show");
}
function currentTotals(){ return C.calcTotals(cart, settings, $("fGov").value, appliedPromo); }
function renderOrderTotals(){
  const t = currentTotals();
  $("orderTotals").innerHTML = `<div><span>المنتجات</span><span>${C.eg(t.subtotal)}</span></div>
    ${t.discount?`<div class="disc"><span>خصم (${appliedCode})</span><span>− ${C.eg(t.discount)}</span></div>`:""}
    <div><span>الشحن (${$("fGov").value})</span><span>${t.fee?C.eg(t.fee):"مجانًا 🎉"}</span></div>
    <div class="grand"><span>الإجمالي</span><span>${C.eg(t.total)}</span></div>`;
  updateVfBox();
}
async function applyPromo(){
  const code = $("fPromo").value.trim().toUpperCase();
  if (!code) return;
  $("promoMsg").style.color="#8a8fa5"; $("promoMsg").textContent = "بنراجع الكود…";
  try {
    const snap = await db.collection("promos").doc(code).get();
    const data = snap.exists ? snap.data() : null;
    const check = C.validatePromo(data, C.cartSubtotal(cart));
    if (!check.ok){
      appliedCode=""; appliedPromo=null;
      $("promoMsg").style.color="#e74c3c";
      $("promoMsg").textContent = {not_found:"الكود ده مش صحيح", inactive:"الكود ده متوقف", expired:"الكود ده انتهى", min_total:"الكود ده شغال للطلبات فوق "+C.eg(check.minTotal)}[check.reason] || "الكود مش شغال";
    } else {
      appliedCode=code; appliedPromo=data;
      $("promoMsg").style.color="#0a7d32";
      $("promoMsg").textContent = "تم تطبيق الخصم 🎉 وفّرت "+C.eg(C.promoDiscount(data, C.cartSubtotal(cart)));
    }
  } catch(e){ $("promoMsg").style.color="#e74c3c"; $("promoMsg").textContent = "حصل خطأ — جرب تاني"; }
  renderOrderTotals();
}
function updateVfBox(){
  const vf = document.querySelector('input[name=pay]:checked').value === "vodafone";
  $("payCod").classList.toggle("sel", !vf);
  $("payVf").classList.toggle("sel", vf);
  $("vfBox").style.display = vf ? "block" : "none";
  if (vf) $("vfBox").innerHTML = `📱 حوّل <b>${C.eg(currentTotals().total)}</b> على رقم فودافون كاش:<br>
    <b style="font-size:19px">${settings.vodafoneNumber || "(الرقم هيظهر قريبًا)"}</b><br>
    بعد التحويل هنكلمك على واتساب لتأكيد الطلب.`;
}
document.querySelectorAll('input[name=pay]').forEach(r => r.addEventListener("change", updateVfBox));

async function placeOrder(){
  const name=$("fName").value.trim(), phone=$("fPhone").value.trim(), addr=$("fAddr").value.trim();
  if (!name) return toast("اكتب اسمك من فضلك");
  if (!C.validEgyptPhone(phone)) return toast("اكتب رقم موبايل مصري صحيح (11 رقم يبدأ بـ 01)");
  if (!addr) return toast("اكتب العنوان بالتفصيل");
  const productsById = {}; cart.forEach(i=>{ const p=products.find(x=>x.id===i.id); if(p) productsById[i.id]=p; });
  const st = C.stockDecrements(cart, productsById);
  if (st.insufficient.length) return toast("الكمية غير متاحة لـ: " + st.insufficient.map(x=>x.name).join("، "));
  const btn=$("placeBtn"); btn.disabled=true; btn.textContent="جاري إرسال الطلب…";
  try {
    const payment = document.querySelector('input[name=pay]:checked').value;
    const order = C.buildOrder({
      items: cart,
      customer: {name, phone, governorate:$("fGov").value, address:addr, notes:$("fNotes").value.trim()},
      payment, settings, promo: appliedPromo, promoCode: appliedCode
    });
    order.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    // كود طلب فريد (مع فحص التصادم)
    let code = "";
    for (let a=0; a<4; a++){
      code = C.genOrderCode();
      const exists = await db.collection("orders").doc(code).get();
      if (!exists.exists) break;
    }
    await db.collection("orders").doc(code).set(order);
    // تخفيض المخزون (أفضل جهد — الأدمن يراجع عند التأكيد)
    for (const op of st.ops) { try { await db.collection("products").doc(op.id).update({stock: op.to}); } catch(e){} }
    cart = []; saveCart();
    const summary = order.items.map(i=>"• "+i.name+" ×"+i.qty).join("\n");
    const waText = encodeURIComponent(`طلب جديد من دكانة 🛍️\nالكود: ${code}\nالاسم: ${name}\n${summary}\nالإجمالي: ${C.eg(order.total)}\nالدفع: ${payment==="vodafone"?"فودافون كاش":"كاش عند الاستلام"}`);
    $("checkoutSheet").innerHTML = `
      <div class="success">
        <div class="check">🎉</div>
        <h2>طلبك وصل يا ${name.split(" ")[0]}!</h2>
        <p style="margin-top:8px;color:#5a5f75">احتفظ بكود الطلب عشان تتبعه من "تتبع طلبك" تحت</p>
        <div class="ordercode">${code}</div>
        ${settings.whatsappNumber ? `<a class="wbtn" href="https://wa.me/${settings.whatsappNumber}?text=${waText}" target="_blank">📲 ابعت طلبك على واتساب لتأكيد أسرع</a>` : ""}
        <p style="margin-top:12px;font-size:13.5px;color:#5a5f75">هنتواصل معك على <b>${phone}</b> لتأكيد الطلب قبل الشحن.</p>
        <button class="bigbtn" onclick="location.hash='';location.reload()">كمّل تسوق 🛍️</button>
      </div>`;
  } catch(e) {
    toast("حصل خطأ أثناء إرسال الطلب — جرب تاني");
    btn.disabled=false; btn.textContent="تأكيد الطلب 🚀";
  }
}

/* ---------- تتبع الطلب ---------- */
async function trackOrder(){
  const code = $("tCode").value.trim().toUpperCase(), phone = $("tPhone").value.trim();
  if (!/^DK-[A-HJ-NP-Z2-9]{6}$/.test(code)) return toast("اكتب كود الطلب الصح (DK-XXXXXX)");
  if (!C.validEgyptPhone(phone)) return toast("اكتب رقم الموبايل الصح");
  $("trackResult").innerHTML = `<div class="empty">بندور على طلبك…</div>`;
  try {
    const snap = await db.collection("orders").doc(code).get();
    if (!snap.exists || snap.data().customer.phone !== phone){
      $("trackResult").innerHTML = `<div class="empty"><span class="e">🤔</span>مفيش طلب بالبيانات دي — تأكد من الكود ورقم الموبايل</div>`;
      return;
    }
    const o = snap.data();
    const steps = [["new","اتقدم"],["confirmed","اتأكد"],["shipped","اتشحن"],["delivered","اتسلم"]];
    let idx = steps.findIndex(s=>s[0]===o.status); if (idx<0) idx=0;
    const canceled = o.status==="canceled";
    $("trackResult").innerHTML = canceled ? `
      <div class="empty"><span class="e">❌</span>الطلب ${code} اتلغى — لو عندك استفسار كلمنا</div>` : `
      <div style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <b>${code}</b><span style="color:#8a8fa5;font-size:13px">${o.createdAt&&o.createdAt.toDate?o.createdAt.toDate().toLocaleDateString("ar-EG"):""}</span>
        </div>
        <div class="statusline">
          ${steps.map((s,i)=>`<div class="st ${i<idx?'done':i===idx?'now done':''}"><i>${i<idx?'✓':i+1}</i>${s[1]}</div>`).join("")}
        </div>
        <div style="background:#f7f8fb;border-radius:14px;padding:12px;margin-top:12px">
          ${o.items.map(i=>`<div style="font-size:13.5px;padding:3px 0">• ${i.name} ×${i.qty} ${i.size?("("+i.size+")"):""} ${i.color?("["+i.color+"]"):""}</div>`).join("")}
          <div style="border-top:1px solid #e4e6ee;margin-top:8px;padding-top:8px;font-weight:800">الإجمالي: ${C.eg(o.total)} — ${o.payment==="vodafone"?"فودافون كاش":"كاش عند الاستلام"}</div>
        </div>
      </div>`;
  } catch(e){ $("trackResult").innerHTML = `<div class="empty">حصل خطأ — جرب تاني</div>`; }
}

/* ---------- تنقل عام ---------- */
function navGo(where){
  document.querySelectorAll("nav a").forEach(a=>a.classList.remove("on"));
  if (where==="cart"){ openCart(); return; }
  if (where==="track"){ $("tOverlay").classList.add("show"); return; }
  document.querySelector("nav a").classList.add("on");
}
function closeOverlay(id){ $(id).classList.remove("show"); }
$("cartBtn").onclick = openCart;
["pOverlay","cOverlay","oOverlay","tOverlay"].forEach(id =>
  $(id).addEventListener("click", e => { if (e.target.id===id){ closeOverlay(id); if(id==="pOverlay") history.replaceState(null,"","#"); } }));

/* ---------- تشغيل ---------- */
skeleton();
loadAll().catch(()=>{ $("grid").innerHTML = `<div class="empty"><span class="e">📡</span>تعذر التحميل — تأكد من الإنترنت وحدّث الصفحة</div>`; });
</script>
</body>
</html>
